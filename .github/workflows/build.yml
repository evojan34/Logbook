name: Build Surgical e-Logbook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Environment & Copy Files
        run: |
          # إنشاء مشروع فلاتر جديد ونظيف في مجلد منفصل
          flutter create --project-name surgical_elogbook --org com.surgeon.elogbook app_workspace
          
          # البحث عن ملف الكود الخاص بك ونسخه بأمان
          if [ -f "main.dart" ]; then
            cp main.dart app_workspace/lib/main.dart
          elif [ -f "lib/main.dart" ]; then
            cp lib/main.dart app_workspace/lib/main.dart
          else
            echo "Error: main.dart not found anywhere!"
            exit 1
          fi
          
          # نسخ ملف الإعدادات
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml app_workspace/pubspec.yaml
          fi

      - name: Build Release APK
        run: |
          cd app_workspace
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surgical-eLogbook-APK
          path: app_workspace/build/app/outputs/flutter-apk/app-release.apk
