name: Build Surgical e-Logbook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Prepare Project Files
        run: |
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
          fi
          sed -i '/\/\/ === END_OF_FILE ===/q' lib/main.dart
          cp -r lib lib_bak
          rm -rf android ios linux macos web windows test pubspec.lock
          flutter create --project-name surgical_elogbook --org com.surgeon.elogbook .
          rm -rf test lib
          mv lib_bak lib

      - name: Verify Dart Syntax
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surgical-eLogbook-APK
          path: build/app/outputs/flutter-apk/app-release.apk
